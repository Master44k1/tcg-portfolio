name: Preise holen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *' # täglich 06:30 UTC, nach dem Cardmarket-Update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cardmarket-Preise holen
        run: npm run data
        env:
          GAMES: '6' # 6 = Pokémon; z. B. '6,1,3' für Pokémon, Magic, Yu-Gi-Oh!
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
