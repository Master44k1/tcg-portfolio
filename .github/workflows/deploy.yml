name: Preise holen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6,18 * * *' # zweimal täglich (06:30 und 18:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bisherigen Preisverlauf holen
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          git clone --depth 1 --branch history "$REPO_URL" history || {
            mkdir -p history && cd history && git init -q -b history && git remote add origin "$REPO_URL"
          }
      - name: Cardmarket-Preise holen
        run: npm run data
      - name: Preisverlauf speichern
        continue-on-error: true # ein Fehler hier soll die Veröffentlichung nicht verhindern
        run: |
          cd history
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Preise $(date -u +%F)" || exit 0
          for i in 1 2 3 4; do git push -q origin history && exit 0; sleep $((i * 10)); done
          exit 1
      - run: npm run build
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
