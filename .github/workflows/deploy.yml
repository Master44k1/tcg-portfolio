name: Preise holen und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6,18 * * *' # zweimal täglich (06:30 und 18:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cardmarket-Preise holen
        run: npm run data
        env:
          GAMES: '6' # 6 = Pokémon; z. B. '6,1,3' für Pokémon, Magic, Yu-Gi-Oh!
      - run: npm run build
      - name: Auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
